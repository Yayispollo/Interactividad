<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La camara de Yayis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            height: 200vh;
            overflow-x: hidden;
        }

        .stage {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Aquí ponemos la imagen de fondo */
            background-image: url('img/tu-imagen-de-fondo.jpg'); /* <--- CAMBIA POR TU IMAGEN */
            background-size: cover;
            background-position: center;
        }

        /* Capa oscura para que las fotos resalten sobre el fondo */
        .stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        /* Cámara */
        .camera-image {
            width: 300px;
            height: 300px;
            object-fit: contain;
            will-change: transform;
            z-index: 10;
            transform-origin: 66% 50%;
        }

        .intro-text {
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
        }

        /* Galería */
        .gallery-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5; /* Por encima del fondo pero debajo del texto */
        }

        .gallery-item {
            position: absolute;
            width: 200px;
            height: 280px;
            border: 5px solid white;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Posiciones fijas */
        .gallery-item:nth-child(1) { top: 10%; left: 35%; transform: rotate(-5deg); }
        .gallery-item:nth-child(2) { top: 10%; right: 10%; transform: rotate(5deg); }
        .gallery-item:nth-child(3) { top: 45%; left: 20%; transform: rotate(2deg); }
        .gallery-item:nth-child(4) { top: 50%; right: 20%; transform: rotate(-2deg); }
        .gallery-item:nth-child(5) { top: 35%; left: 50%; transform: rotate(0deg); }
        .gallery-item:nth-child(6) { top: 10%; left: 10%; transform: rotate(-5deg); }
    </style>
</head>
<body>

    <section class="stage">
        <div class="intro-text" id="introText">
            <h1>Galería de Yayis</h1>
            <p>Haz scroll para entrar en el lente</p>
        </div>

        <img src="img/camarayayis.png" id="cameraImage" class="camera-image" alt="Cámara">

        <div class="gallery-container" id="galleryItems">
            <div class="gallery-item"><img src="img/bren_edit.png" alt="1"></div>
            <div class="gallery-item"><img src="img/edit_tilin.png" alt="2"></div>
            <div class="gallery-item"><img src="img/eli_edit.png" alt="3"></div>
            <div class="gallery-item"><img src="img/fri_edit.png" alt="4"></div>
            <div class="gallery-item"><img src="img/DSC01201.JPG" alt="5"></div>
            <div class="gallery-item"><img src="img/DSC01214.JPG" alt="6"></div>
        </div>
    </section>

    <script>
        const cameraImage = document.getElementById('cameraImage');
        const introText = document.getElementById('introText');
        const galleryItems = document.querySelectorAll('.gallery-item');

        function animate() {
            const scrollTop = window.scrollY;
            
            const zoomProgress = Math.min(scrollTop / 800, 1);
            const scale = 1 + (zoomProgress * 15);
            
            cameraImage.style.transform = `scale(${scale})`;
            cameraImage.style.opacity = 1 - zoomProgress;
            introText.style.opacity = 1 - (zoomProgress * 3);

            galleryItems.forEach((item) => {
                if (zoomProgress > 0.4) {
                    item.style.opacity = (zoomProgress - 0.4) * 2;
                } else {
                    item.style.opacity = 0;
                }
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
