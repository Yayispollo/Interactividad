<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Cámara Inmersiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 300vh;
            overflow-x: hidden;
        }

        /* Sección 1: Cámara que se agranda */
        .camera-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .camera-container {
            perspective: 1000px;
        }

        .camera-image {
            width: 300px;
            height: 300px;
            background-image: url('img/camara.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.3));
        }

        .camera-image.zoomed {
            width: 600px;
            height: 600px;
        }

        /* Sección 2: Galería de imágenes con parallax */
        .gallery-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            overflow: hidden;
        }

        .gallery-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.1) 2px,
                    rgba(0, 0, 0, 0.1) 4px
                ),
                radial-gradient(circle, #FF69B4 0%, #FF1493 100%);
            z-index: 0;
        }

        .gallery-items {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        .gallery-item {
            position: absolute;
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: bold;
            color: #FF1493;
            border: 3px solid #FFB6D9;
            transition: transform 0.05s ease-out;
        }

        .gallery-item:nth-child(1) { top: 10%; left: 5%; background: linear-gradient(135deg, #E8F5E9, #C8E6C9); }
        .gallery-item:nth-child(2) { top: 20%; right: 8%; background: linear-gradient(135deg, #FFF3E0, #FFE0B2); }
        .gallery-item:nth-child(3) { top: 50%; left: 15%; background: linear-gradient(135deg, #F3E5F5, #E1BEE7); }
        .gallery-item:nth-child(4) { top: 35%; right: 12%; background: linear-gradient(135deg, #E3F2FD, #BBDEFB); }
        .gallery-item:nth-child(5) { bottom: 15%; left: 25%; background: linear-gradient(135deg, #FCE4EC, #F8BBD0); }
        .gallery-item:nth-child(6) { bottom: 20%; right: 20%; background: linear-gradient(135deg, #F1F8E9, #DCEDC8); }
        .gallery-item:nth-child(7) { top: 60%; left: 50%; background: linear-gradient(135deg, #EFEBE9, #D7CCC8); }
        .gallery-item:nth-child(8) { bottom: 25%; right: 5%; background: linear-gradient(135deg, #FFF9C4, #FFF59D); }

        /* Texto introductorio */
        .intro-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .intro-text h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .intro-text p {
            font-size: 1.2em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .intro-text.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Sección 1: Cámara con Zoom -->
    <section class="camera-section">
        <div class="intro-text" id="introText">
            <h1>📷 Entra en la Cámara</h1>
            <p>Haz scroll para amplificar</p>
        </div>
        <div class="camera-container">
            <div class="camera-image" id="cameraImage"></div>
        </div>
    </section>

    <!-- Sección 2: Galería con Parallax -->
    <section class="gallery-section">
        <div class="gallery-container">
            <div class="gallery-background"></div>
            <div class="gallery-items" id="galleryItems">
                <div class="gallery-item">📸</div>
                <div class="gallery-item">🎬</div>
                <div class="gallery-item">🖼️</div>
                <div class="gallery-item">🌟</div>
                <div class="gallery-item">💫</div>
                <div class="gallery-item">✨</div>
                <div class="gallery-item">🎨</div>
                <div class="gallery-item">🎭</div>
            </div>
        </div>
    </section>

    <script>
        // Variables globales
        const cameraImage = document.getElementById('cameraImage');
        const introText = document.getElementById('introText');
        const galleryItems = document.querySelectorAll('.gallery-item');
        let scrollProgress = 0;
        let mouseX = 0;
        let mouseY = 0;

        // Detectar scroll
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            scrollProgress = scrollTop / docHeight;

            // Efecto de zoom de cámara (primeros 100vh)
            const cameraSection = document.querySelector('.camera-section');
            const cameraSectionHeight = cameraSection.offsetHeight;
            const cameraSectionProgress = Math.min(scrollTop / cameraSectionHeight, 1);

            // Escalar la cámara
            const scale = 1 + cameraSectionProgress * 3;
            cameraImage.style.transform = `scale(${scale})`;

            // Ocultar texto introductorio
            if (cameraSectionProgress > 0.5) {
                introText.classList.add('hidden');
            } else {
                introText.classList.remove('hidden');
            }

            // Activar parallax en galería después del scroll
            const gallerySection = document.querySelector('.gallery-section');
            const galleryStart = cameraSectionHeight;
            const distanceFromGallery = scrollTop - galleryStart;

            if (distanceFromGallery > 0) {
                applyParallax(distanceFromGallery);
            }
        });

        // Detectar movimiento del mouse
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Aplicar parallax basado en posición del mouse
            applyMouseParallax();
        });

        // Función de parallax basada en movimiento del mouse
        function applyMouseParallax() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const percentX = (mouseX - centerX) / (centerX / 2);
            const percentY = (mouseY - centerY) / (centerY / 2);

            galleryItems.forEach((item, index) => {
                const moveX = percentX * (10 + index * 3);
                const moveY = percentY * (10 + index * 3);
                
                item.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        }

        // Función de parallax basada en scroll
        function applyParallax(distance) {
            galleryItems.forEach((item, index) => {
                const speed = 0.5 + (index * 0.1);
                const moveY = distance * speed;
                const rotation = (distance * 0.02) + (index * 5);
                
                item.style.transform = `translateY(${moveY}px) rotate(${rotation}deg)`;
            });
        }

        // Animación inicial suave
        window.addEventListener('load', () => {
            cameraImage.style.animation = 'float 3s ease-in-out infinite';
        });

        // Agregar animación de flotación
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-20px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
