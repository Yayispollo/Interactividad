<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Cámara Inmersiva</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            height: 200vh; /* Solo necesitamos un poco de scroll para activar la magia */
            overflow-x: hidden;
        }

        /* Contenedor principal que se queda fijo */
        .stage {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Cámara */
        .camera-image {
            width: 300px;
            height: 300px;
            object-fit: contain;
            will-change: transform;
            z-index: 10;
        }

        /* Galería */
        .gallery-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .gallery-item {
            position: absolute;
            width: 200px;
            height: 280px;
            border: 5px solid white;
            border-radius: 10px;
            opacity: 0; /* Invisibles al inicio */
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Posiciones fijas de las fotos */
        .gallery-item:nth-child(1) { top: 10%; left: 10%; transform: rotate(-5deg); }
        .gallery-item:nth-child(2) { top: 10%; right: 10%; transform: rotate(5deg); }
        .gallery-item:nth-child(3) { top: 60%; left: 20%; transform: rotate(2deg); }
        .gallery-item:nth-child(4) { top: 60%; right: 20%; transform: rotate(-2deg); }
        .gallery-item:nth-child(5) { top: 35%; left: 40%; transform: rotate(0deg); }

        .intro-text {
            position: absolute;
            color: white;
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <section class="stage">
        <div class="intro-text" id="introText">
            <h1>Galería de Yayis</h1>
            <p>Haz scroll para entrar en el lente</p>
        </div>

        <img src="img/camarayayis.png" id="cameraImage" class="camera-image" alt="Cámara">

        <div class="gallery-container" id="galleryItems">
            <div class="gallery-item"><img src="img/bren_edit.png" alt="1"></div>
            <div class="gallery-item"><img src="img/edit_tilin.png" alt="2"></div>
            <div class="gallery-item"><img src="img/eli_edit.png" alt="3"></div>
            <div class="gallery-item"><img src="img/fri_edit.png" alt="imagen 4"></div>
            <div class="gallery-item"><img src="img/DSC01201.JPG" alt="imagen 5"></div>
        </div>
    </section>

    <script>
        const cameraImage = document.getElementById('cameraImage');
        const introText = document.getElementById('introText');
        const galleryItems = document.querySelectorAll('.gallery-item');

        function animate() {
            const scrollTop = window.scrollY;
            
            // Zoom: el zoom termina a los 800px de scroll
            const zoomProgress = Math.min(scrollTop / 800, 1);
            const scale = 1 + (zoomProgress * 15);
            
            cameraImage.style.transform = `scale(${scale})`;
            cameraImage.style.opacity = 1 - zoomProgress;
            introText.style.opacity = 1 - (zoomProgress * 3);

            // Aparecer fotos: empiezan a aparecer cuando zoomProgress > 0.4
            galleryItems.forEach((item) => {
                if (zoomProgress > 0.4) {
                    item.style.opacity = (zoomProgress - 0.4) * 2;
                } else {
                    item.style.opacity = 0;
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
